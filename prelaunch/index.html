<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LUDWISE — Coming soon</title>
    <meta
      name="description"
      content="LUDWISE is a PC game discovery and price-comparison platform. Coming soon."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ludwise.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LUDWISE" />
    <meta property="og:title" content="LUDWISE — Coming soon" />
    <meta
      property="og:description"
      content="Discover PC games and compare prices across trusted stores."
    />
    <meta property="og:url" content="https://ludwise.com/" />
    <meta name="theme-color" content="#0b0b0a" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #0b0b0a;
        color: #f7f5f1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgb(232 163 61 / 12%), transparent 36rem), #0b0b0a;
      }

      main {
        width: min(100% - 3rem, 46rem);
        padding-block: 4rem;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 4.5rem;
        color: #f7f5f1;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      .brand-mark {
        width: 2rem;
        height: 2rem;
        flex: none;
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #e8a33d;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.8rem, 9vw, 5.75rem);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 0.96;
        text-wrap: balance;
      }

      .intro {
        max-width: 38rem;
        margin: 2rem auto 0;
        color: #b7b6b3;
        font-size: clamp(1.05rem, 2.5vw, 1.3rem);
        line-height: 1.65;
        text-wrap: balance;
      }

      .contact {
        margin: 2rem 0 0;
        font-size: 0.95rem;
      }

      .contact a {
        color: #f7f5f1;
        text-decoration-color: #e8a33d;
        text-underline-offset: 0.25em;
      }

      .contact a:hover,
      .contact a:focus-visible {
        color: #e8a33d;
      }

      footer {
        margin-top: 4rem;
        color: #777672;
        font-size: 0.8rem;
      }

      @media (max-width: 36rem) {
        main {
          width: min(100% - 2rem, 46rem);
        }

        .brand {
          margin-bottom: 3.5rem;
        }

        footer {
          margin-top: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="LUDWISE">
        <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="LUDWISE logo mark">
          <rect width="64" height="64" rx="14" fill="#e8a33d"></rect>
          <path
            d="M10 18h16v13h13v13h15"
            fill="none"
            stroke="#0b0b0a"
            stroke-width="6"
            stroke-linecap="square"
          ></path>
        </svg>
        <span>LUDWISE</span>
      </div>

      <p class="eyebrow">Coming soon</p>
      <h1>Find the game. Compare the stores.</h1>
      <p class="intro">
        LUDWISE is building a clearer way to discover PC games and compare prices across trusted
        stores.
      </p>
      <p class="contact">
        <a href="mailto:hello@ludwise.com">hello@ludwise.com</a>
      </p>

      <footer>© 2026 LUDWISE</footer>
    </main>
  </body>
</html>
