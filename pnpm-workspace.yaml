# pnpm settings. This is NOT a workspace declaration - there is no `packages:`
# key, so the repository remains a single package. pnpm 11 moved these settings
# out of package.json's "pnpm" field, which it no longer reads.

# Native binaries that legitimately need a postinstall step. Everything else is
# denied by default, so a new dependency cannot silently execute build scripts.
allowBuilds:
  esbuild: true # native bundler binary, used by Vite/Astro
  protobufjs: true # transitive; used by wrangler telemetry
  workerd: true # the Cloudflare Workers runtime itself - dev and build fail without it

# Transitive security patches.
#
# All four reach the tree only through @usebruno/cli, which runs API contract
# tests and never enters the Worker bundle, so none of these are runtime
# exposure. They are pinned anyway: fourteen standing Dependabot alerts train
# you to dismiss alerts, and the one that matters then looks like the rest.
#
# Each target is the first patched version per the advisory. Remove an entry
# once Bruno ships a release that already resolves above it.
overrides:
  axios: '>=1.18.0'
  form-data: '>=4.0.6'
  nanoid: '>=3.3.18'
  uuid: '>=11.1.1'

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y@6.10.2 has not yet widened its peer range to ESLint
    # 10, but eslint-plugin-astro@3 requires both. The plugin works on 10.
    # Revisit when jsx-a11y publishes a release declaring ESLint 10 support.
    eslint-plugin-jsx-a11y>eslint: '10'

# Written by pnpm when accepting releases newer than the minimum release age.
minimumReleaseAgeExclude:
  - eslint@10.9.0
  - miniflare@5.20260820.0-alpha
  - wrangler@4.125.0
