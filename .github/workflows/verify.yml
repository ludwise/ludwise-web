name: Verify

# The full validation suite, factored out so that CI and both deployment
# workflows run the identical thing. A deployment that validated with a slightly
# different pipeline than the one guarding pull requests is not validated.
on:
  workflow_call:

permissions: {}

env:
  FORCE_COLOR: '1'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs pull request code and never pushes, so the credential
          # is removed from the workspace.
          persist-credentials: false

      # Must precede setup-node: its pnpm cache resolution shells out to
      # `pnpm store path`, which fails opaquely if pnpm is not installed yet.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No version input: packageManager in package.json is the single source
        # of truth, which keeps CI and local machines in lockstep.

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates .astro/types.d.ts. Without it, astro check and type-aware lint
      # fail with confusing "cannot find module astro:middleware" errors that do
      # not reproduce locally, because a local .astro/ survives from a dev run.
      - name: Sync Astro types
        run: pnpm run sync

      # worker-configuration.d.ts is generated from wrangler.jsonc and is not
      # committed, so a fresh clone has no binding types at all until this runs.
      # It must precede typecheck for the same reason the Astro sync does.
      - name: Generate Cloudflare binding types
        run: pnpm run cf-typegen

      # Ordered cheapest and most likely to fail first. Running the formatting
      # check after a build would waste a minute on every formatting typo.
      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck tests
        run: pnpm run typecheck:tests

      # Unit, architecture and contract tests. The architecture suite is the one
      # that matters most on a public repository: it fails if anything calls
      # fetch outside the API client, imports a Cloudflare binding outside the
      # composition root, or commits something shaped like a credential.
      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      # Only Chromium. A second engine doubles the slowest step in this job to
      # re-answer a question about our own markup rather than about a browser.
      - name: Install the end-to-end browser
        run: pnpm exec playwright install --with-deps chromium

      # The local config needs one, and it carries no secret - this Worker has
      # none. Copied rather than committed so the file stays gitignored, which
      # is what keeps the habit right in a public repository.
      - name: Prepare local configuration
        run: cp .dev.vars.example .dev.vars

      # Three suites, three backend states, run separately because each state is
      # a property of the whole backend process rather than of one request.
      #
      # The fake backend replays responses recorded from the real backend's own
      # routes (docs/architecture.md), so this proves the interface renders what
      # the backend actually sends - without needing the private repository, a
      # database, or any credential.
      - name: Run end-to-end and accessibility tests
        run: pnpm run test:e2e

      - name: Run the empty-catalogue tests
        run: pnpm run test:e2e:empty

      # The most important of the three. It asserts that a backend outage
      # renders as "we could not load this" rather than as "there are no games",
      # which is the distinction the whole error layer exists to preserve.
      - name: Run the backend-unavailable tests
        run: pnpm run test:e2e:degraded

      # The trace of a failed run, which is the difference between diagnosing a
      # CI-only failure and re-running the job hoping it explains itself.
      - name: End-to-end failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Resolves wrangler.jsonc exactly as a real deploy would, for both
      # environments, and stops immediately before uploading. This is what
      # catches a malformed service binding, a route claimed by two Workers, or
      # a typo in an environment block while it is still a pull request.
      #
      # It contacts no Cloudflare API and needs no token, which is why it can run
      # on pull requests at all. The account id is a repository variable, passed
      # only so Wrangler never has to look one up.
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for target in staging production; do
            echo "::group::wrangler dry-run ($target)"
            CLOUDFLARE_ENV="$target" pnpm run build
            pnpm exec wrangler deploy --dry-run

            # The bindings the Worker actually ships with, checked per
            # environment and only ever after a build. The adapter merges its
            # own additions into dist/server/wrangler.json, so this is the first
            # point at which the real deployment configuration exists - the
            # `Test` step above runs before any build and the suite skips there
            # by design.
            #
            # Inside the loop rather than after it because the file is
            # overwritten on each pass: run once at the end and only production
            # would ever be examined.
            pnpm exec vitest run tests/architecture/deployment-bindings.test.ts
            echo "::endgroup::"
          done

      # The audit that only matters because this repository is public: a commit
      # that lands here cannot be unpublished. It scans everything git tracks -
      # documentation, workflows, fixtures and configuration, not only src/ -
      # because those are the files nobody thinks of as code, and therefore the
      # ones a credential ends up in.
      #
      # Only BLOCKING findings fail. An IMPORTANT one is a judgement call, and a
      # check that failed on every judgement call would be switched off within a
      # week.
      - name: Audit what this repository publishes
        run: node scripts/audit-public.mjs

      # The public-repository check that no other step performs: that the built
      # client bundle carries nothing it should not. The architecture suite
      # checks the source; this checks the artifact, which is what a visitor
      # actually receives.
      - name: Check the built bundle for leakage
        run: node scripts/check-bundle.mjs
