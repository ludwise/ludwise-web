name: Verify

on:
  workflow_call:

permissions: {}

env:
  FORCE_COLOR: '1'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Astro types
        run: pnpm run sync

      - name: Generate Cloudflare binding types
        run: pnpm run cf-typegen

      - name: Check formatting
        run: |
          pnpm exec prettier README.md --write
          git diff -- README.md
          exit 1

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec astro check

      - name: Typecheck tests
        run: pnpm exec tsc -p tsconfig.test.json --noEmit

      - name: Test
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm exec astro build

      # Astro writes the merged deployment bindings only during this build.
      - name: Verify deployment bindings
        env:
          LUDWISE_REQUIRE_BUILD_OUTPUT: '1'
        run: pnpm exec vitest run tests/architecture/deployment-bindings.test.ts

      - name: Prepare local configuration
        run: cp .dev.vars.example .dev.vars

      # The script clears Vite's optimizer cache before and after this probe.
      # Concurrent requests therefore exercise the cold dependency graph, and
      # Playwright also starts with no graph populated by this earlier check.
      - name: Verify cold concurrent dev SSR
        run: node scripts/check-dev-ssr.mjs

      - name: Install the end-to-end browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end and accessibility tests
        run: pnpm exec playwright test

      - name: Run the empty-catalogue tests
        run: pnpm exec playwright test --config=playwright.states.config.ts

      - name: Run the backend-unavailable tests
        run: node scripts/run-degraded.mjs

      - name: End-to-end failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for target in staging production; do
            echo "::group::wrangler dry-run ($target)"
            CLOUDFLARE_ENV="$target" pnpm exec astro build
            pnpm exec wrangler deploy --dry-run
            # Check each environment before the next build overwrites its output.
            pnpm exec vitest run tests/architecture/deployment-bindings.test.ts
            echo "::endgroup::"
          done

      - name: Audit what this repository publishes
        run: node scripts/audit-public.mjs

      - name: Check the built bundle for leakage
        run: node scripts/check-bundle.mjs

  language:
    name: Language
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the language checker
        run: pnpm exec vitest run tests/unit/scripts/ste

      - name: Check the governed prose
        run: pnpm run check:ste

      - name: Audit the repository
        if: always()
        run: node scripts/ste/cli.mjs audit --format markdown >> "$GITHUB_STEP_SUMMARY"
